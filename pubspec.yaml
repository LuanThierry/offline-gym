name: offline_gym
description: Aplicativo offline para planejar treinos, hábitos, tarefas e acompanhar a evolução.
publish_to: none
version: 1.4.2+9

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  share_plus: ^11.0.0
  archive: ^4.0.0
  cryptography: ^2.9.0
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  provider: ^6.1.5+1
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  table_calendar: ^3.2.0
  fl_chart: ^0.71.0
  intl: ^0.20.2
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  file_selector: ^1.1.0
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.2
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: '#6C5CE7'
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21

