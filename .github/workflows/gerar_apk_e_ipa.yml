name: Validar e gerar artefato iOS (.ipa)

on:
  workflow_dispatch: # Permite clicar em "Run workflow" manualmente no GitHub
  push:
    branches:
      - main
    tags:
      - 'v*' # Roda automaticamente quando você cria uma tag como v1.4.0

jobs:
  # ============================================================================
  # Compilação iPhone / iOS (.ipa não assinado) — Servidor Mac Gratuito
  # ============================================================================
  build-ios:
    name: Compilar iPhone (.ipa sem Mac físico)
    runs-on: macos-latest
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Flutter no macOS
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependências e gerar ícones iOS
        run: |
          flutter pub get
          flutter analyze
          flutter test
          dart run flutter_launcher_icons

      - name: Compilar aplicativo iOS Release (sem assinatura paga da Apple)
        run: |
          flutter build ios --release --no-codesign

      - name: Empacotar Runner.app em arquivo instalável .ipa (para Sideloadly / AltStore)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 Offline-Gym-iOS.ipa Payload

      - name: Disponibilizar Offline-Gym-iOS.ipa para download nos Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Offline-Gym-iPhone-IPA
          path: Offline-Gym-iOS.ipa

  # ============================================================================
  # Publicar Release no GitHub com o IPA não assinado anexado
  # ============================================================================
  publish-release:
    name: Publicar Release no GitHub
    needs: build-ios
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Baixar IPA
        uses: actions/download-artifact@v4
        with:
          name: Offline-Gym-iPhone-IPA

      - name: Criar ou Atualizar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Offline-Gym-iOS.ipa
          body: |
            ### Artefato iOS (.ipa para Sideloading)
            > **Nota sobre o build iOS:** O arquivo `.ipa` anexado foi compilado sem assinatura oficial da Apple (`--no-codesign`). Ele destina-se exclusivamente à instalação via Sideload pessoal (usando ferramentas gratuitas como AltStore ou Sideloadly) e **não** está assinado nem pronto para submissão direta à Apple App Store.
            
            O build Android (APK assinado) é gerado e assinado localmente pelo mantenedor com sua chave de produção.
          generate_release_notes: true
